<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School — plainlyHuman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a class="logo" href="index.html">plainly<span>Human</span></a>
  <nav>
    <a href="start-here.html">Start Here</a>
    <a href="finance.html">Finance</a>
    <a href="work.html">Work</a>
    <a href="school.html" class="active">School</a>
    <a href="worth.html">What's It Worth?</a>
    <a href="deals-groceries.html">Deals &amp; Groceries</a>
  </nav>
</header>

<section class="page-hero">
  <span class="eyebrow">Education</span>
  <h1>School</h1>
  <p class="sub">Student budgeting, made simple — see where you stand before the semester gets messy.</p>
</section>

<section class="tool-section" id="studentbudget">
  <div class="section-label">Free forever</div>
  <h2 class="section-title">Student Budget</h2>
  <div class="tool-card">
    <div class="field"><label for="s-job">Monthly income (job, allowance)</label><input type="number" id="s-job" placeholder="$ 0"></div>
    <div class="field"><label for="s-loans">Monthly loan/grant funds available</label><input type="number" id="s-loans" placeholder="$ 0"></div>
    <div class="field"><label for="s-rent">Rent / residence</label><input type="number" id="s-rent" placeholder="$ 0"></div>
    <div class="field"><label for="s-food">Food</label><input type="number" id="s-food" placeholder="$ 0"></div>
    <div class="field"><label for="s-books">Textbooks &amp; supplies (monthly average)</label><input type="number" id="s-books" placeholder="$ 0"></div>
    <div class="field"><label for="s-transport">Transportation</label><input type="number" id="s-transport" placeholder="$ 0"></div>
    <div class="field"><label for="s-other">Everything else (phone, fun, etc.)</label><input type="number" id="s-other" placeholder="$ 0"></div>
    <button class="calc-btn" onclick="calcStudent()">See my student budget</button>
    <div class="result" id="student-result">
      <div class="label">Left over each month</div>
      <div class="big" id="student-left">$0</div>
      <div class="note" id="student-note"></div>
    </div>
  </div>
</section>

<footer>
  <div class="footer-inner">
    <div class="foot-brand">plainlyHuman — tools for real life.</div>
    <div class="foot-links"><a href="about.html">About Us</a><a href="how-we-make-money.html">How We Make Money</a></div>
  </div>
</footer>

<script>
function calcStudent() {
  const income = (parseFloat(document.getElementById('s-job').value) || 0) + (parseFloat(document.getElementById('s-loans').value) || 0);
  const expenses = ['s-rent','s-food','s-books','s-transport','s-other']
    .reduce((sum, id) => sum + (parseFloat(document.getElementById(id).value) || 0), 0);
  const left = income - expenses;
  document.getElementById('student-left').textContent = '$' + left.toFixed(0);
  document.getElementById('student-note').textContent = left < 0
    ? "Your expenses are running ahead of your income this month — worth checking the Grocery Budget and Deals & Groceries tools for ways to trim."
    : left < 100
    ? "You're breaking even, but there's not much cushion for surprises like a car repair or a sick week."
    : "You've got some breathing room — consider tucking a bit of this into savings before it disappears into spending.";
  document.getElementById('student-result').classList.add('show');
}
</script>

</body>
</html>
